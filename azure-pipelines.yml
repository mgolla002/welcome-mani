trigger:
  branches:
    include: [ main ]

pool:
  vmImage: ubuntu-latest

variables:
  - group: jfrog-vars
  - name: imageName
    value: welcome-mani
  - name: tag
    value: $(Build.BuildId)

stages:
- stage: Build
  jobs:
  - job: BuildTest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt build twine
      displayName: Install dependencies

    - script: pytest -q
      displayName: Run tests

    - script: python -m build
      displayName: Build wheel

    - publish: dist
      artifact: python-dist

- stage: PublishJFrog
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Publish
    steps:
    - download: current
      artifact: python-dist

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        pip install twine
        twine upload \
          --repository-url https://$(JFROG_URL)/artifactory/api/pypi/pypl-local \
          -u $(JFROG_USER) -p $(JFROG_TOKEN) \
          $(Pipeline.Workspace)/python-dist/*
      displayName: Upload wheel to JFrog PyPi-local

        - script: |
        docker build -t $(JFROG_URL)/docker-trial/$(imageName):$(tag) \
                     -t $(JFROG_URL)/docker-trial/$(imageName):latest .
      displayName: Build Docker image

    - script: |
        echo "$(JFROG_TOKEN)" | docker login $(JFROG_URL) -u $(JFROG_USER) --password-stdin
        docker push $(JFROG_URL)/docker-trial/$(imageName):$(tag)
        docker push $(JFROG_URL)/docker-trial/$(imageName):latest
      displayName: Push image to JFrog